# near-sdk 5.30.1 has MSRV 1.95.0 (it declares `rust-version = 1.95`), so this
# crate pins that exact toolchain. rustup picks this file up automatically for
# any cargo invocation inside contract/. If it is missing on your machine:
#     rustup toolchain install 1.95.0
[toolchain]
channel = "1.95.0"
